name: Stage 11.8 lockfile bootstrap

on:
  push:
    branches:
      - stage-11-8-query-form-filter-architecture
    paths:
      - .github/workflows/stage11-8-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-11-8-query-form-filter-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add pinned TanStack Query dependency
        run: npm install --package-lock-only --ignore-scripts --save-exact @tanstack/react-query@5.102.8
      - name: Commit generated package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(stage11.8): add TanStack Query dependency"
          git push origin HEAD:stage-11-8-query-form-filter-architecture
